[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "permit-agent-permissions"
version = "0.1.0"
description = "Reproducible training and evaluation of revocable agent permissions"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
permit = "permit.cli:main"

[tool.setuptools.packages.find]
include = ["permit*"]
